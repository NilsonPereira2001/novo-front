<div class="loading-container">
  <!-- Spinner Circular com Logo Central -->
  <div class="spinner-wrapper">
    <div class="spinner-ring"></div>
    <div class="center-badge">
      <span>W</span>
    </div>
  </div>

  <!-- Textos -->
  <div class="loading-textos">
    <h2 class="loading-titulo">Carregando suas informações</h2>
    <p class="loading-subtitulo">Estamos buscando os dados atualizados. Isso leva só alguns segundos.</p>
  </div>

  <!-- Barra de progresso horizontal -->
  <div class="loading-barra">
    <div class="progresso-animado"></div>
  </div>

  <!-- Pontos indicadores inferiores -->
  <div class="loading-pontos">
    <span class="ponto"></span>
    <span class="ponto"></span>
    <span class="ponto"></span>
  </div>
</div>
